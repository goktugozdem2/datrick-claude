<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1584, initial-scale=1">
    <title>Datrick LinkedIn personal cover</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1584px;
        height: 396px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #101a25;
        color: #f7faf9;
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }

      .cover {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      .cover::before {
        position: absolute;
        inset: 0;
        z-index: -3;
        content: "";
        background:
          linear-gradient(90deg, rgba(16, 26, 37, 0.98) 0 24%, rgba(16, 26, 37, 0.72) 61%, rgba(16, 26, 37, 0.94) 100%),
          linear-gradient(135deg, #101a25 0%, #14343b 58%, #2c1f35 100%);
      }

      .grid {
        position: absolute;
        inset: 0 0 0 58%;
        z-index: -2;
        opacity: 0.34;
        background-image:
          linear-gradient(rgba(142, 234, 255, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(142, 234, 255, 0.16) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: skewX(-12deg) scale(1.15);
        transform-origin: center;
      }

      .signal {
        position: absolute;
        right: 68px;
        bottom: -150px;
        z-index: -1;
        width: 570px;
        height: 310px;
        border: 2px solid rgba(142, 234, 255, 0.34);
        border-radius: 50%;
        box-shadow:
          0 0 0 42px rgba(18, 134, 216, 0.08),
          0 0 0 92px rgba(216, 102, 223, 0.06);
      }

      .node {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #8eeaff;
        box-shadow: 0 0 20px rgba(142, 234, 255, 0.78);
      }

      .node.one { right: 146px; top: 78px; }
      .node.two { right: 345px; top: 169px; background: #d866df; }
      .node.three { right: 82px; top: 265px; }

      .content {
        position: absolute;
        top: 78px;
        left: 360px;
        right: 74px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 56px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #8eeaff;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 900px;
        font-size: 53px;
        line-height: 1.03;
        letter-spacing: 0;
      }

      .scope {
        margin: 20px 0 0;
        color: #c5d0cb;
        font-size: 23px;
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .identity {
        min-width: 280px;
        padding: 20px 24px;
        border-left: 4px solid #d866df;
        background: rgba(247, 250, 249, 0.06);
      }

      .identity strong,
      .identity span {
        display: block;
      }

      .identity strong {
        font-size: 23px;
        line-height: 1.2;
      }

      .identity span {
        margin-top: 8px;
        color: #c5d0cb;
        font-size: 18px;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <main class="cover" aria-label="Datrick production AI and data operations">
      <div class="grid" aria-hidden="true"></div>
      <div class="signal" aria-hidden="true"></div>
      <div class="node one" aria-hidden="true"></div>
      <div class="node two" aria-hidden="true"></div>
      <div class="node three" aria-hidden="true"></div>

      <section class="content">
        <div>
          <p class="eyebrow">For IT service firms and technology teams</p>
          <h1>Production AI &amp; Data Operations</h1>
          <p class="scope">AI evaluation · Data platforms · Database operations</p>
        </div>
        <div class="identity">
          <strong>Founder, Datrick</strong>
          <span>Claude Partner Network</span>
        </div>
      </section>
    </main>
  </body>
</html>
