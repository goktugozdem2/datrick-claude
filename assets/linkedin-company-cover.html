<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1128, initial-scale=1">
    <title>Datrick LinkedIn company cover</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1128px;
        height: 191px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #101a25;
        color: #f7faf9;
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }

      .cover {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      .cover::before {
        position: absolute;
        inset: 0;
        z-index: -3;
        content: "";
        background:
          linear-gradient(90deg, rgba(16, 26, 37, 0.96) 0 20%, rgba(16, 26, 37, 0.72) 56%, rgba(16, 26, 37, 0.92) 100%),
          linear-gradient(135deg, #101a25 0%, #142f38 55%, #291d35 100%);
      }

      .grid {
        position: absolute;
        inset: 0 0 0 56%;
        z-index: -2;
        opacity: 0.34;
        background-image:
          linear-gradient(rgba(142, 234, 255, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(142, 234, 255, 0.16) 1px, transparent 1px);
        background-size: 28px 28px;
        transform: skewX(-12deg) scale(1.15);
        transform-origin: center;
      }

      .signal {
        position: absolute;
        right: 48px;
        bottom: -74px;
        z-index: -1;
        width: 400px;
        height: 200px;
        border: 1px solid rgba(142, 234, 255, 0.36);
        border-radius: 50%;
        box-shadow:
          0 0 0 26px rgba(18, 134, 216, 0.08),
          0 0 0 58px rgba(168, 63, 179, 0.06);
      }

      .node {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8eeaff;
        box-shadow: 0 0 14px rgba(142, 234, 255, 0.78);
      }

      .node.one { right: 104px; top: 36px; }
      .node.two { right: 244px; top: 82px; background: #d866df; }
      .node.three { right: 58px; top: 126px; }

      .content {
        position: absolute;
        top: 25px;
        left: 254px;
        right: 50px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #8eeaff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 690px;
        font-size: 31px;
        line-height: 1.04;
        letter-spacing: 0;
      }

      .scope {
        margin: 10px 0 0;
        color: #c5d0cb;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .partner {
        min-width: 182px;
        padding: 12px 14px;
        border-left: 2px solid #d866df;
        background: rgba(247, 250, 249, 0.06);
      }

      .partner strong,
      .partner span {
        display: block;
      }

      .partner strong {
        font-size: 14px;
        line-height: 1.2;
      }

      .partner span {
        margin-top: 4px;
        color: #c5d0cb;
        font-size: 11px;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <main class="cover" aria-label="Datrick production AI and data operations">
      <div class="grid" aria-hidden="true"></div>
      <div class="signal" aria-hidden="true"></div>
      <div class="node one" aria-hidden="true"></div>
      <div class="node two" aria-hidden="true"></div>
      <div class="node three" aria-hidden="true"></div>

      <section class="content">
        <div>
          <p class="eyebrow">For IT service firms and technology teams</p>
          <h1>Production AI &amp; Data Operations</h1>
          <p class="scope">Claude workflows · AI evaluation · DBA · Migrations · BI</p>
        </div>
        <div class="partner">
          <strong>Claude Partner Network participant</strong>
          <span>Senior-led delivery worldwide</span>
        </div>
      </section>
    </main>
  </body>
</html>
